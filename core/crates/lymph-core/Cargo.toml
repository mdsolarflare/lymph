[package]
name = "lymph-core"
description = "Lymph biometric core — pure data logic (entities, validation, CSV/ZIP, import semantics, chart math). No I/O, no browser APIs."
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[lib]
crate-type = ["rlib", "cdylib"]
